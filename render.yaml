# Render Blueprint Specification for SevaGap
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. SevaGap Node.js/Express REST API Backend (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: sevagap-backend
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: '*'
      # Optional external MySQL configuration (e.g. Aiven, TiDB, Clever Cloud)
      # If omitted, SevaGap automatically runs in resilient fallback mode with demo data
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: sevagap_db

  # ---------------------------------------------------------------------------
  # 2. SevaGap React Frontend (Static Site on Render)
  # ---------------------------------------------------------------------------
  - type: web
    name: sevagap-frontend
    runtime: static
    rootDir: .
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sevagap-backend.onrender.com/api
